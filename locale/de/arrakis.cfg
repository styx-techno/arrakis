[mod-setting-description]
arrakis-worm-bite=Was ein Sandwurm mit einem Spice-Ernter macht, den er erwischt. Wirkt erst ab der Wurm-Phase, wenn es Sandwürmer gibt.

[string-mod-setting]
arrakis-worm-bite-total-loss=Totalverlust: Ernter und Ladung weg, das Wrack bleibt
arrakis-worm-bite-heavy-damage=Schwer beschädigt: Ernter überlebt, Ladung weg
