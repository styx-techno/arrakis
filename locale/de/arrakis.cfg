[space-location-name]
arrakis=Arrakis

[space-location-description]
arrakis=Ein Wüstenplanet ohne offenes Wasser. Riesige Sandwürmer bewachen das wertvollste Gut des Systems: Spice.

[space-connection-name]
vulcanus-arrakis=Vulcanus – Arrakis

