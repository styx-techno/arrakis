melange=Das Gewürz. Verdirbt nicht.
spice-essence=Konzentriertes Spice. Verdirbt mit der Zeit.
arrakis-sand=Feiner Wüstensand, fällt beim Raffinieren von Spice an.
arrakis-spice-briquette=Gepresster Brennstoff aus Spice-Sand und Kohle. Macht Fahrzeuge nicht schneller.

