[technology-description]
planet-discovery-arrakis=Ermöglicht Raumplattformen den Flug nach Arrakis.
arrakis-windtrap=Gewinnt Wasser aus der Luft. Auf Arrakis gibt es kein offenes Wasser.
arrakis-spice-processing=Die Spice-Raffinerie gewinnt Melange aus Spice-Sand.
spice-science-pack=Spice-Wissenschaft, herstellbar nur auf Arrakis.
melange-productivity=Mehr Melange pro Raffinerie-Durchlauf.
arrakis-spice-harvesting=Der Spice-Ernter fördert Spice-Sand im offenen Sand. Die Spice-Annahme auf Fels entlädt ihn, der Tankstutzen füllt Treibstoff nach.

