[tips-and-tricks-item-description]
arrakis-briefing=Auf Arrakis ist Fels sicher, Sand lebt. Jede Maschine auf Sand erzeugt Vibration: ein aufgebauter Spice-Ernter viel, ein fahrendes Fahrzeug weniger, arbeitende Bohrer und Fabriken wenig. Die Vibration heizt die Gegend auf. Erst bebt der Sand, dann erscheint ein Wurmzeichen, und nach dem Countdown frisst ein Sandwurm alles im Umkreis von 4 Kacheln auf Sand (den Ernter je nach Einstellung „Wurmbiss“). Was ganz auf Fels steht oder in der Luft ist, bleibt verschont. Am Anfang lässt die Wüste dir Zeit: Die Schonfrist steht oben links.
arrakis-wormsign-tip=Wurmzeichen heißt Lebensgefahr: Alarm, Kartenmarkierung, Warnton und ein roter Ring mit Countdown zeigen das Ziel. Nach 60 s (beim ersten Ernter 90 s) beißt der Wurm. Der Sandwurm taucht weit entfernt auf, fährt nie über Fels und zerdrückt auf dem Weg Bänder, Schienen, Gebäude, Fahrzeuge und Figuren auf Sand. Retten: mit dem Ornithopter über den Ernter fliegen und anheben (__CONTROL__arrakis-carry-toggle__ oder Verknüpfung „Ernter anheben oder absetzen“) und bis 0 in der Luft halten. Ohne Ornithopter: einpacken und ganz auf Fels fahren – das schafft der Ernter nur vom Lehrfeld nah am Fels. Wird der Ring grün, steht das Ziel sicher. Danach ist die Gegend 2 bis 4 Minuten ruhig. Im Ernterfenster packt der Vorsichtsmodus bei Unruhe selbst ein. Die Verknüpfung „Vibrationsanzeige“ zeigt, wie heiß der Sand ist.

[mod-setting-name]
arrakis-worm-bite=Wurmbiss
arrakis-depot-range=Reichweite der Leitstelle

[mod-setting-description]
arrakis-worm-bite=Was ein Sandwurm mit einem Spice-Ernter macht, den er im Bissradius beißt oder auf dem Weg zerdrückt. Andere Fahrzeuge und Gebäude auf Sand sterben immer.
arrakis-depot-range=Bis zu so vielen Kacheln um eine Ornithopter-Leitstelle betreuen ihre Carryalls Spice-Ernter.

[string-mod-setting]
arrakis-worm-bite-total-loss=Totalverlust: Ernter und Ladung weg, das Wrack bleibt
arrakis-worm-bite-heavy-damage=Schwer beschädigt: Ernter überlebt, Ladung weg
