[entity-description]
spice-sand=Rötlicher Sand mit Spuren von Melange. Kommt nur im offenen Sand vor.
arrakis-deep-water=Wasser tief unter dem Fels. Wird mit einer Pumpe (Pumpjack) gefördert.
arrakis-windtrap=Kondensiert Wasser aus der Luft. Braucht keinen Strom, liefert aber nur wenig. Funktioniert nicht im Weltraum.
spice-refinery=Verarbeitet Spice-Sand zu Melange und stellt Spice-Wissenschaft her. Hat 50 % Grundproduktivität.
spice-harvester=Schweres, langsames Raupenfahrzeug. Auf einem Spicefeld mit __CONTROL__arrakis-harvester-toggle__ aufbauen, dann füllt es seinen Laderaum mit Spice-Sand. Erntet nur auf Arrakis. Lässt sich auf Sand nicht aufheben.
arrakis-spice-intake=Ein Spice-Ernter, der daneben anhält, dockt an. Greifarme entladen dann seinen Laderaum. Der ganze Andockkreis muss Fels sein; vor dem Pflastern bauen.
arrakis-fuel-nozzle=Neben eine Spice-Annahme bauen (höchstens 3 Kacheln). Greifarme tanken darüber den angedockten Ernter auf.
arrakis-ornithopter=Bemannter Flieger. Hebt einen Spice-Ernter an (__CONTROL__arrakis-carry-toggle__ oder Verknüpfung in der Leiste), trägt ihn und setzt ihn ab. Fliegt nur mit Raketentreibstoff oder Besserem; Atomtreibstoff und höhere Qualität machen ihn schneller.
arrakis-sandworm-small=Kommt bei einem Wurmzeichen aus der Tiefe, fährt nur über Sand und beißt nach dem Countdown. Unterwegs zerdrückt er Bänder, Schienen, Gebäude, Fahrzeuge und Figuren auf Sand, die vor seinem Kopf liegen. Ornithopter in der Luft erreicht er nie, und auf Fels kommt er nicht.
arrakis-carryall=Unbemannter Lastenflieger, gehört zur nächsten Ornithopter-Leitstelle. Rettet Spice-Ernter in Reichweite bei Wurmzeichen, bringt volle Ernter zur Spice-Annahme und tankt leere nach. Fliegt nur mit Raketentreibstoff oder Besserem, etwas schneller als der Ornithopter. Per Fernbedienung oder mit Fahrer fliegt er von Hand, bis er wieder leer an der Leitstelle parkt.
arrakis-depot=Nur auf Fels. Carryalls parken hier und holen sich Flugtreibstoff und Ernter-Treibstoff aus ihrem Lager: Raketen- oder Atomtreibstoff zum Fliegen, Kohle oder Spice-Briketts für die Ernter. Betreut Ernter im gezeigten Umkreis.

