[mod-setting-description]
arrakis-worm-bite=What a sandworm does to a spice harvester it bites within the bite radius or crushes on its way. Other vehicles and buildings on sand always die.
arrakis-depot-range=Carryalls serve spice harvesters up to this many tiles around their ornithopter depot.
arrakis-worms-enabled=Off: no new wormsigns. Vibration, unrest and running hunts stay.
arrakis-warn-seconds=Countdown of a normal hunt. Early warning and territory level are added; the teaching hunt stays at 90 s.
arrakis-wormsign-threshold=The wormsign comes from this heat on (territory level as a factor). Unrest from 60 % of it.
arrakis-vibration-percent=Factor on the vibration of all sources except the thumper.
arrakis-rest-percent=Factor on the rest of a territory after a hunt (base 2 to 4 minutes).
arrakis-max-hunts=At most this many worm hunts run at the same time (thumper lures do not count).
arrakis-free-minutes=A territory stays without a worm this long after its worm was killed. 0: a new worm is there at once.
arrakis-thumper-seconds=A thumper pounds this long before it falls apart.
arrakis-tooth-percent=Factor on the loot (2 to 4 worm teeth per small worm). 0: no loot.

