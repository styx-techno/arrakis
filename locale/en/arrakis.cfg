[entity-description]
spice-sand=Reddish sand with traces of melange. Only found in open sand.
arrakis-deep-water=Water deep beneath the rock. Extracted with a pumpjack.
arrakis-windtrap=Condenses water from the air. Needs no power but yields little. Does not work in space.
spice-refinery=Processes spice sand into melange and produces spice science. Has 50% base productivity.
spice-harvester=Heavy, slow tracked vehicle. Deploy it on a spice field with __CONTROL__arrakis-harvester-toggle__ and it fills its cargo hold with spice sand. Only harvests on Arrakis. Cannot be picked up on sand.
arrakis-spice-intake=A spice harvester that stops next to it docks. Inserters then unload its cargo hold. The whole docking circle must be rock; build it before paving.
arrakis-fuel-nozzle=Build next to a spice intake (at most 3 tiles). Inserters refuel the docked harvester through it.
arrakis-ornithopter=Manned flyer. Lifts a spice harvester (__CONTROL__arrakis-carry-toggle__ or the shortcut in the toolbar), carries it and drops it off. Flies only on rocket fuel or better; nuclear fuel and higher quality make it faster.
arrakis-sandworm-small=Rises from the deep at a wormsign, travels only over sand and bites after the countdown. On its way it crushes belts, rails, buildings, vehicles and characters on sand that lie in front of its head. It never reaches ornithopters in the air, and it cannot get onto rock.
arrakis-carryall=Unmanned cargo flyer belonging to the nearest ornithopter depot. Rescues spice harvesters in range at a wormsign, brings full harvesters to a spice intake and refuels empty ones. Flies only on rocket fuel or better, a little faster than the ornithopter. With a remote or a driver it flies by hand until it is parked empty at the depot again.
arrakis-depot=Rock only. Carryalls park here and take flight fuel and harvester fuel from its storage: rocket or nuclear fuel to fly, coal or spice briquettes for the harvesters. Serves harvesters within the radius shown. With the research "Fleet control" it deploys spare harvesters from its storage; on the wire it reads signal H (target count) and R (recall) and outputs its status signals.
arrakis-thumper=Pounds the sand for one minute (vibration 60), then falls apart. Sand only. Built within 160 tiles of a running hunt, it diverts the worm to itself (the countdown stays). Without a hunt it lures a worm by itself after about 20 s. While a hunt targets it, it keeps pounding until the hunt ends. Hunts on a thumper reset neither heat nor rest.
spice-harvester-mk2=Like the spice harvester, but with worm teeth in its intake: mines 50 % more spice sand (using 50 % more fuel while harvesting) vibrates 20 % less. Cargo hold 60 instead of 40 slots, 50 % more health.

