[technology-description]
planet-discovery-arrakis=Allows space platforms to travel to Arrakis.
arrakis-windtrap=Extracts water from the air. Arrakis has no open water.
arrakis-spice-processing=The spice refinery extracts melange from spice sand.
spice-science-pack=Spice science, can only be made on Arrakis.
melange-productivity=More melange per refinery cycle.
arrakis-spice-harvesting=The spice harvester mines spice sand in open sand. The spice intake on rock unloads it, the fuel nozzle refuels it.

