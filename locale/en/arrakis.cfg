[mod-setting-description]
arrakis-worm-bite=What a sandworm bite does to a spice harvester within the bite radius. Other vehicles and buildings on sand always die.

[string-mod-setting]
arrakis-worm-bite-total-loss=Total loss: harvester and cargo gone, the wreck remains
arrakis-worm-bite-heavy-damage=Heavy damage: harvester survives, cargo gone
