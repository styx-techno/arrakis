arrakis-briefing=Arrakis
arrakis-wormsign-tip=Wormsign

[tips-and-tricks-item-description]
arrakis-briefing=On Arrakis, rock is safe and sand is alive. Every machine on sand causes vibration: a deployed spice harvester a lot, a moving vehicle less, working drills and factories a little. The vibration heats up the area. First the sand trembles, then a wormsign appears, and after the countdown a sandworm devours everything on sand within 4 tiles (the harvester depending on the setting "Worm bite"). Whatever stands entirely on rock or is in the air is spared. At first the desert gives you time: the grace period is shown in the top left.
arrakis-wormsign-tip=Wormsign means mortal danger: an alert, a map marker, a warning sound and a red ring with a countdown mark the target. After 60 s (90 s for the first harvester) the worm bites. The sandworm surfaces far away, never crosses rock and crushes belts, rails, buildings, vehicles and characters on sand along its way. To rescue it: fly the ornithopter over the harvester, lift it (__CONTROL__arrakis-carry-toggle__ or the shortcut "Lift or drop harvester") and keep it in the air until 0. Without an ornithopter: pack up and drive entirely onto rock – the harvester only makes it from the training field close to the rock. When the ring turns green, the target is safe. Afterwards the worm lurks in the area for 2 to 4 minutes: deploying there again calls it right back. In the harvester window, careful mode packs up by itself when the sand trembles. The shortcut "Vibration overlay" shows how hot the sand is.

