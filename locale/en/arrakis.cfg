[item-description]
melange=The spice. Does not spoil.
spice-essence=Concentrated spice. Spoils over time.
arrakis-sand=Fine desert sand, a by-product of spice refining.
arrakis-spice-briquette=Pressed fuel made from spice sand and coal. Does not make vehicles faster.

[controls]
arrakis-harvester-toggle=Spice harvester: deploy, pack up, undock

[mod-setting-name]
arrakis-worm-bite=Worm bite

[mod-setting-description]
arrakis-worm-bite=What a sandworm does to a spice harvester it catches. Takes effect from the worm phase on, once there are sandworms.

[string-mod-setting]
arrakis-worm-bite-total-loss=Total loss: harvester and cargo gone, the wreck remains
arrakis-worm-bite-heavy-damage=Heavy damage: harvester survives, cargo gone
