[technology-description]
planet-discovery-arrakis=Allows space platforms to travel to Arrakis.
arrakis-windtrap=Extracts water from the air. Arrakis has no open water.
arrakis-spice-processing=The spice refinery extracts melange from spice sand.
spice-science-pack=Spice science, can only be made on Arrakis.
melange-productivity=More melange per refinery cycle.
arrakis-spice-harvesting=The spice harvester mines spice sand in open sand. The spice intake on rock unloads it, the fuel nozzle refuels it.
arrakis-ornithopter=Researched as soon as the first spice harvester has been crafted.
arrakis-ornithopter-depot=The depot dispatches unmanned carryalls: they rescue spice harvesters at a wormsign, bring full harvesters to a spice intake and refuel empty ones.
arrakis-fleet-control=The depot runs a harvester fleet: it places spare harvesters from its storage on good spice fields, moves them when a field is empty and recalls all harvesters to rock on signal R. The target count comes from its window or from signal H on the wire.

