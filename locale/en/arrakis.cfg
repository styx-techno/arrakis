[technology-description]
planet-discovery-arrakis=Allows space platforms to travel to Arrakis.
arrakis-windtrap=Extracts water from the air. Arrakis has no open water.
arrakis-spice-processing=The spice refinery extracts melange from spice sand.
spice-science-pack=Spice science, can only be made on Arrakis.
melange-productivity=More melange per refinery cycle.
arrakis-spice-harvesting=The spice harvester mines spice sand in open sand. The spice intake on rock unloads it, the fuel nozzle refuels it.
arrakis-ornithopter=Researched as soon as the first spice harvester has been crafted.
arrakis-ornithopter-depot=The depot dispatches unmanned carryalls: they rescue spice harvesters at a wormsign, bring full harvesters to a spice intake and refuel empty ones.
arrakis-fleet-control=The depot runs a harvester fleet: it places spare harvesters from its storage on good spice fields, moves them when a field is empty and recalls all harvesters to rock on signal R. The target count comes from its window or from signal H on the wire.
arrakis-escort-flight=Free carryalls of the depot hover over deployed spice harvesters. When a wormsign comes, the escort couples at once. One stays at the depot for rescues if it has at least two.
arrakis-early-warning=Wormsigns come earlier: each level adds 5 seconds to the countdown of regular hunts, up to 90 seconds after 6 levels.
arrakis-territory-survey=The desert is divided into worm territories: calm, normal and wild. After this research the vibration overlay and the depot show each territory's border, name and level, and the depot sends harvesters to calm territories first.
arrakis-harvest-damping=Deployed and packing spice harvesters vibrate less: 5 % less per level, half after 10 levels.
arrakis-thumper=A pounding device for the sand. It diverts a running hunt to itself or lures a worm on purpose; it buys no rest.
arrakis-thumper-trigger=Survive a worm hunt (escape or kill the worm).
arrakis-harvester-mk2=An improved spice harvester with worm teeth in its intake: mines 50 % more, is 20 % quieter, holds 60 instead of 40 slots and has 50 % more health.

